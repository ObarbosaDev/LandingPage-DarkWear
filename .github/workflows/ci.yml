name: CI

# Roda a cada envio para a main e em todo pull request: estilo, testes e o build de produção.
# O build também confere os tipos, então um erro de TypeScript derruba a verificação.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Build de produção
        run: npm run build
        env:
          # Banco Postgres em memória: o CI não precisa de banco nem de segredos.
          PGLITE_DIR: memory://
